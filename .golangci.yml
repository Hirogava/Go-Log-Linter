# Конфигурация golangci-lint для проверки кода самого линтера
# Не используем loglint здесь, так как это сам линтер

linters:
  enable:
    - govet        # Стандартный анализатор Go
    - errcheck     # Проверка необработанных ошибок
    - staticcheck  # Расширенный статический анализ
    - unused       # Неиспользуемый код
    - gosimple     # Упрощение кода
    - ineffassign  # Неэффективные присваивания
    - typecheck    # Проверка типов

linters-settings:
  govet:
    check-shadowing: true  # Проверка затенения переменных
  errcheck:
    check-blank: true      # Проверка _ = err

run:
  timeout: 5m              # Таймаут для линтера
  tests: true              # Проверять тестовые файлы

issues:
  exclude-rules:
    # Исключаем testdata из проверок (это примеры с ошибками)
    - path: testdata/
      linters:
        - all
